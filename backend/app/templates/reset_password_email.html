<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your Polaris password</title>
</head>
<!-- Inline styles with the values of the tokens of docs/design/BRIEF.md: mail clients ignore CSS variables -->

<body style="margin:0;padding:32px 16px;background:#EBDFDC;font-family:Manrope,Arial,sans-serif;color:#261627;">
    <table role="presentation" align="center" width="100%" style="max-width:460px;border-collapse:separate;">
        <tr>
            <td style="padding:36px 32px;background:#F6EFEC;border-radius:26px;">
                <p style="margin:0 0 20px;font-size:18px;font-weight:800;">Polaris</p>
                <h1 style="margin:0 0 12px;font-size:24px;font-weight:800;letter-spacing:-.02em;">Reset your password
                </h1>
                <p style="margin:0 0 28px;font-size:14px;line-height:1.5;color:#6E5862;">Someone asked for a new
                    password for your Polaris account. The link works for one hour. If it was not you, ignore this email
                    and nothing changes.</p>
                <a href="{{ link }}"
                    style="display:inline-block;padding:13px 24px;background:#261627;color:#EBDFDC;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;">Set
                    a new password</a>
            </td>
        </tr>
    </table>
</body>

</html>
