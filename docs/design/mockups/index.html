<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaris · Mockups</title>
<style>
body{margin:0;padding:32px;font:14px/1.5 system-ui,sans-serif;background:#f3f3f3;color:#222}
h1{margin:0 0 20px;font-size:22px}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1300px}
.cell{color:#555;text-decoration:none;font-size:13px}
.thumb{position:relative;aspect-ratio:1280/760;overflow:hidden;background:#ddd;margin-bottom:4px}
.thumb iframe{position:absolute;top:0;left:0;width:1280px;height:760px;border:0;transform-origin:0 0;transform:scale(var(--s,.33));pointer-events:none}
</style>
</head>
<body>
<h1>Polaris mockups: 13 screens</h1>
<div class="cells"><a class="cell" href="courses.html"><div class="thumb"><iframe src="courses.html" loading="lazy" tabindex="-1" scrolling="no" title="Courses"></iframe></div><span>Courses</span></a><a class="cell" href="dashboard.html"><div class="thumb"><iframe src="dashboard.html" loading="lazy" tabindex="-1" scrolling="no" title="Dashboard"></iframe></div><span>Dashboard</span></a><a class="cell" href="auth-login.html"><div class="thumb"><iframe src="auth-login.html" loading="lazy" tabindex="-1" scrolling="no" title="Log in"></iframe></div><span>Log in</span></a><a class="cell" href="auth-register.html"><div class="thumb"><iframe src="auth-register.html" loading="lazy" tabindex="-1" scrolling="no" title="Register"></iframe></div><span>Register</span></a><a class="cell" href="courses-tags-overlay.html"><div class="thumb"><iframe src="courses-tags-overlay.html" loading="lazy" tabindex="-1" scrolling="no" title="Tags"></iframe></div><span>Tags</span></a><a class="cell" href="course-tables-side-by-side.html"><div class="thumb"><iframe src="course-tables-side-by-side.html" loading="lazy" tabindex="-1" scrolling="no" title="Tables side by side"></iframe></div><span>Tables side by side</span></a><a class="cell" href="course-tables-stacked.html"><div class="thumb"><iframe src="course-tables-stacked.html" loading="lazy" tabindex="-1" scrolling="no" title="Tables stacked"></iframe></div><span>Tables stacked</span></a><a class="cell" href="course-tables-empty.html"><div class="thumb"><iframe src="course-tables-empty.html" loading="lazy" tabindex="-1" scrolling="no" title="Tables empty"></iframe></div><span>Tables empty</span></a><a class="cell" href="course-table-interactions.html"><div class="thumb"><iframe src="course-table-interactions.html" loading="lazy" tabindex="-1" scrolling="no" title="Table interactions"></iframe></div><span>Table interactions</span></a><a class="cell" href="course-add-column-dialog.html"><div class="thumb"><iframe src="course-add-column-dialog.html" loading="lazy" tabindex="-1" scrolling="no" title="Add column"></iframe></div><span>Add column</span></a><a class="cell" href="course-edit-column-dialog.html"><div class="thumb"><iframe src="course-edit-column-dialog.html" loading="lazy" tabindex="-1" scrolling="no" title="Edit column"></iframe></div><span>Edit column</span></a><a class="cell" href="calendar-today-selected.html"><div class="thumb"><iframe src="calendar-today-selected.html" loading="lazy" tabindex="-1" scrolling="no" title="Calendar, today"></iframe></div><span>Calendar, today</span></a><a class="cell" href="calendar-other-day-selected.html"><div class="thumb"><iframe src="calendar-other-day-selected.html" loading="lazy" tabindex="-1" scrolling="no" title="Calendar, other day"></iframe></div><span>Calendar, other day</span></a></div>
<script>
/* scale each 1280px page down to its thumbnail width */
function fit(){document.querySelectorAll('.thumb').forEach(t=>{t.firstElementChild.style.setProperty('--s',t.clientWidth/1280)})}
addEventListener('load',fit);addEventListener('resize',fit);fit();
</script>
</body>
</html>
