  <text x="252" y="674" font-size="11" text-anchor="start" font-weight="normal" fill="#777">1 hover on a column header: circle with an x deletes the column.   2 hover on a number column: edit circle opens the edit dialog (course-edit-column-dialog.svg), plus the x circle.</text>
  <text x="252" y="690" font-size="11" text-anchor="start" font-weight="normal" fill="#777">3 hover on a row title: circle with an x deletes the row.   4 a number cell is edited in place.   5 a new column gets a default label (Default bool-col. / Default num-col.), edited in place.</text>
  <text x="252" y="706" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Both tables behave the same way. The circles appear on hover and are slightly darker than the cell they are in.</text>
