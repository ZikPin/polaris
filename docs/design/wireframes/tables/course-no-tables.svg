  <text x="252" y="318" font-size="11" text-anchor="start" font-weight="normal" fill="#777">A course without table types: the message takes the place of the tables (REQ-F-89), in soft ink like other empty states.</text>
  <text x="252" y="334" font-size="11" text-anchor="start" font-weight="normal" fill="#777">The Tables button in the header opens the table types dialog (courses-tables-overlay.svg).</text>
