  <text x="252" y="1116" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Tables wrap like words: one that does not fit the rest of the row starts the next row (Labs with two columns, then Lectures). No sideways scrolling.</text>
  <text x="252" y="1132" font-size="11" text-anchor="start" font-weight="normal" fill="#777">A long title wraps onto further lines instead of being cut (Chapter 5), the row grows and its other cells stay centered.</text>
  <text x="252" y="1148" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Default grey: header darker, title column lighter, body lightest. The thin + buttons are outside the table (a column on its right, a row below it).</text>
  <text x="252" y="1164" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Under the title: the tags of the course, then its full description (both can be empty, then the tables move up).</text>
