  <text x="252" y="651" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Cards: 4 per row (flex grid), the fifth wraps. Grey bar = course color (default grey). The Tags filter next to the title is the same select as on the dashboard.</text>
  <text x="252" y="667" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Under the tags a card shows the description, cut after 150 characters with an ellipsis (Algorithms). Clicking a card opens the course, the buttons do not.</text>
  <text x="252" y="683" font-size="11" text-anchor="start" font-weight="normal" fill="#777">The edit button opens the course dialog (courses-edit-dialog.svg), there is no inline edit. The delete button asks for a confirmation. Adding a course stays the input above the cards.</text>
  <text x="252" y="699" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Navbar: Courses expands to the list of courses, Dashboard and Calendar are single entries.</text>
