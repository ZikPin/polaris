  <text x="252" y="716" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Opened by the edit button of a card, on top of the page, like the tag overlay. Adding a course does not use it: the input above the cards stays.</text>
  <text x="252" y="732" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Option panels like the column dialogs: title, tags (two checkbox rows per line), description (multi-line, at most 1000 characters), color (the ten accents, one chosen, default the first).</text>
