  <text x="252" y="735" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Expanded add card (▴ collapses it, the values stay): the fields of the course dialog in two columns, without their panels.</text>
  <text x="252" y="751" font-size="11" text-anchor="start" font-weight="normal" fill="#777">No danger mark here, nothing can be lost when adding. + creates the course with all fields at once.</text>
  <text x="252" y="767" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Afterwards the card is empty again (no tags, no tables, default color, not hidden) and stays expanded. A failed add keeps everything and shows the error.</text>
