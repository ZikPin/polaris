  <text x="132" y="224.7" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Add a card for every course</text>
  <text x="132" y="243.7" font-size="12" text-anchor="start" font-weight="normal" fill="#555">and give it a color and tags.</text>
  <text x="132" y="262.7" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Open one to track its</text>
  <text x="132" y="281.7" font-size="12" text-anchor="start" font-weight="normal" fill="#555">lectures and assignments</text>
  <text x="132" y="300.7" font-size="12" text-anchor="start" font-weight="normal" fill="#555">in simple tables.</text>
