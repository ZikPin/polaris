  <text x="132" y="419" font-size="12" text-anchor="start" font-weight="normal" fill="#555">See how far you are in every</text>
  <text x="132" y="438" font-size="12" text-anchor="start" font-weight="normal" fill="#555">course, with the numbers and</text>
  <text x="132" y="457" font-size="12" text-anchor="start" font-weight="normal" fill="#555">everything still open. Filter</text>
  <text x="132" y="476" font-size="12" text-anchor="start" font-weight="normal" fill="#555">by tag to focus on what</text>
  <text x="132" y="495" font-size="12" text-anchor="start" font-weight="normal" fill="#555">matters now.</text>
