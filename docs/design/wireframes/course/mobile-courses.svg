  <rect x="16" y="648" width="328" height="28" fill="#bdbdbd" stroke="#8c8c8c" />
  <text x="28" y="704" font-size="16" text-anchor="start" font-weight="bold" fill="#333">Databases</text>
  <rect x="28" y="718" width="82" height="20" fill="#d4d4d4" stroke="none" />
  <text x="69" y="732" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">Semester 2</text>
  <text x="28" y="758" font-size="11" text-anchor="start" font-weight="normal" fill="#555">Relational model, SQL and normalization. A</text>
  <text x="28" y="773" font-size="11" text-anchor="start" font-weight="normal" fill="#555">project in a small team counts for half of</text>
  <text x="28" y="788" font-size="11" text-anchor="start" font-weight="normal" fill="#555">the grade.</text>
  <rect x="274" y="802" width="28" height="28" fill="#d0d0d0" stroke="#8c8c8c" />
  <text x="288" y="821" font-size="15" text-anchor="middle" font-weight="normal" fill="#333">✎</text>
  <rect x="306" y="802" width="28" height="28" fill="#d0d0d0" stroke="#8c8c8c" />
  <text x="320" y="821" font-size="15" text-anchor="middle" font-weight="normal" fill="#333">✕</text>
  <text x="180" y="868" font-size="12" text-anchor="middle" font-weight="normal" fill="#777">…  two more cards, one per row</text>
  <text x="16" y="898" font-size="11" text-anchor="start" font-weight="normal" fill="#777">One card per row. The Tags filter sits directly</text>
  <text x="16" y="914" font-size="11" text-anchor="start" font-weight="normal" fill="#777">under the title.</text>
  <text x="16" y="930" font-size="11" text-anchor="start" font-weight="normal" fill="#777">The description is cut after 150 characters here</text>
  <text x="16" y="946" font-size="11" text-anchor="start" font-weight="normal" fill="#777">too.</text>
  <text x="16" y="962" font-size="11" text-anchor="start" font-weight="normal" fill="#777">The tags button in the header opens the tags dialog.</text>
