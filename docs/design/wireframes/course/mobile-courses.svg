  <text x="69" y="537" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">Semester 1</text>
  <rect x="116" y="523" width="41.2" height="20" fill="#d4d4d4" stroke="none" />
  <text x="136.6" y="537" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">Math</text>
  <text x="28" y="563" font-size="11" text-anchor="start" font-weight="normal" fill="#555">Vectors, matrices and eigenvalues. Weekly</text>
  <text x="28" y="578" font-size="11" text-anchor="start" font-weight="normal" fill="#555">sheets, no exam.</text>
  <rect x="274" y="592" width="28" height="28" fill="#d0d0d0" stroke="#8c8c8c" />
  <text x="288" y="611" font-size="15" text-anchor="middle" font-weight="normal" fill="#333">✎</text>
  <rect x="306" y="592" width="28" height="28" fill="#d0d0d0" stroke="#8c8c8c" />
  <text x="320" y="611" font-size="15" text-anchor="middle" font-weight="normal" fill="#333">✕</text>
