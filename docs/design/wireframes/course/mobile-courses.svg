  <text x="129.8" y="312" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">CS</text>
  <text x="28" y="338" font-size="11" text-anchor="start" font-weight="normal" fill="#555">Sorting, graphs, dynamic programming and</text>
  <text x="28" y="353" font-size="11" text-anchor="start" font-weight="normal" fill="#555">complexity analysis. The exam is open</text>
  <text x="28" y="368" font-size="11" text-anchor="start" font-weight="normal" fill="#555">book, so the plan is to finish every</text>
  <text x="28" y="383" font-size="11" text-anchor="start" font-weight="normal" fill="#555">assignment sheet by the end of Nov…</text>
  <rect x="274" y="397" width="28" height="28" fill="#d0d0d0" stroke="#8c8c8c" />
  <text x="288" y="416" font-size="15" text-anchor="middle" font-weight="normal" fill="#333">✎</text>
