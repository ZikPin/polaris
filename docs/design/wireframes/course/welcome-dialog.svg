  <text x="252" y="716" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Opens over the courses page right after registering, logging in skips it. The cross is the only way to close it, there is no other button.</text>
  <text x="252" y="732" font-size="11" text-anchor="start" font-weight="normal" fill="#777">From 1000px wide: three columns, 80% of the window wide (at most 1200px), as high as its content. In each: title, text of at most three sentences, then a hint of the page.</text>
  <text x="252" y="748" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Below 1000px the columns become rows with a small hint beside the text, the dialog keeps its normal width (see the phone wireframe).</text>
