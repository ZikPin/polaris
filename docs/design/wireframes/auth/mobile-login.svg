<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="sans-serif">
  <rect x="0" y="0" width="360" height="720" fill="#fafafa" stroke="none" />
  <rect x="0" y="0" width="360" height="56" fill="#d9d9d9" stroke="#8c8c8c" />
  <text x="16" y="35" font-size="18" text-anchor="start" font-weight="bold" fill="#333">Polaris</text>
  <rect x="16" y="88" width="328" height="422" fill="#f4f4f4" stroke="#8c8c8c" />
  <rect x="16" y="88" width="328" height="6" fill="#8c8c8c" stroke="none" />
  <text x="180" y="146" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Log in</text>
  <rect x="32" y="170" width="296" height="44" fill="#ececec" stroke="#333" />
  <circle cx="52" cy="192" r="9" fill="#555" />
  <text x="52" y="196" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">!</text>
  <text x="72" y="197" font-size="13" text-anchor="start" font-weight="normal" fill="#333">Invalid email or password.</text>
  <text x="32" y="246" font-size="12" text-anchor="start" font-weight="normal" fill="#333">Email</text>
  <rect x="32" y="252" width="296" height="44" fill="#ffffff" stroke="#757575" />
  <text x="46" y="279" font-size="14" text-anchor="start" font-weight="normal" fill="#333">user@example.com</text>
  <text x="32" y="328" font-size="12" text-anchor="start" font-weight="normal" fill="#333">Password</text>
  <rect x="32" y="334" width="296" height="44" fill="#ffffff" stroke="#757575" />
  <text x="46" y="361" font-size="14" text-anchor="start" font-weight="normal" fill="#333">••••••••</text>
  <rect x="32" y="400" width="296" height="44" fill="#d0d0d0" stroke="#8c8c8c" />
  <text x="180" y="427" font-size="13" text-anchor="middle" font-weight="normal" fill="#333">Log in</text>
  <text x="180" y="478" font-size="12" text-anchor="middle" font-weight="normal" fill="#333">No account yet? Register</text>
  <text x="16" y="546" font-size="11" text-anchor="start" font-weight="normal" fill="#777">Logged out: the header only has the name, no burger</text>
  <text x="16" y="562" font-size="11" text-anchor="start" font-weight="normal" fill="#777">and no tags button.</text>
  <text x="16" y="578" font-size="11" text-anchor="start" font-weight="normal" fill="#777">The card is as wide as the screen minus the margins,</text>
  <text x="16" y="594" font-size="11" text-anchor="start" font-weight="normal" fill="#777">error banner under the title.</text>
</svg>
