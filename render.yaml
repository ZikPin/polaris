# Render blueprint: one web service built from the Dockerfile. The database is Supabase, so the five DB_* values
# are entered in the Render dashboard (from Supabase: Connect, Session pooler). SECRET_KEY is generated.
services:
  - type: web
    name: polaris
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
