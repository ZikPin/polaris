# Render blueprint: one web service built from the Dockerfile. The database is Supabase, so the five DB_* values
# are entered in the Render dashboard (from Supabase: Connect, Session pooler), and so are RESEND_API_KEY and APP_URL
# (the address of the app, for the links in emails). SECRET_KEY is generated.
services:
  - type: web
    name: polaris
    runtime: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
