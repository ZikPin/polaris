<header class="topbar">
  <a class="brand" routerLink="/courses">
    <span class="brand-mark"><app-icon name="star" /></span>
    Polaris
  </a>
  @if (auth.user(); as user) {
    <nav class="topbar-actions" aria-label="Account">
      <button class="btn btn-ghost" type="button" (click)="tagsOpen.set(true)"><app-icon name="tag" />Tags</button>
      <span class="user">{{ user.email }}</span>
      <button class="btn btn-ghost" type="button" (click)="logout()"><app-icon name="logout" />Log out</button>
    </nav>
  }
</header>
<div [class.shell]="auth.user()">
  @if (auth.user()) {
    <aside class="sidebar">
      <nav aria-label="Main">
        <div class="nav-group" [class.open]="coursesOpen()">
          <div class="nav-row">
            <a class="nav-item" routerLink="/courses" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="coursesOpen.set(true)">
              <app-icon name="courses" />Courses
            </a>
            <button class="nav-toggle" type="button" [attr.aria-expanded]="coursesOpen()" aria-label="Show or hide the courses" (click)="coursesOpen.set(!coursesOpen())">
              <app-icon name="chevron-down" />
            </button>
          </div>
          <ul class="nav-sub">
            @for (course of courseApi.all(); track course.id) {
              <li>
                <a [routerLink]="['/courses', course.id]" routerLinkActive="active" [attr.title]="course.title"><i class="dot"></i><span>{{ course.title }}</span></a>
              </li>
            }
          </ul>
        </div>
        <a class="nav-item" routerLink="/dashboard" routerLinkActive="active"><app-icon name="dashboard" />Dashboard</a>
        <a class="nav-item" routerLink="/calendar" routerLinkActive="active"><app-icon name="calendar" />Calendar</a>
      </nav>
    </aside>
  }
  <main [class.main]="auth.user()">
    <router-outlet />
  </main>
</div>
@if (tagsOpen()) {
  <app-tags-dialog (closed)="tagsOpen.set(false)" />
}
