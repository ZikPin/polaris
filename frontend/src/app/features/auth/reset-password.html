<div class="auth">
  <section class="auth-card">
    <i class="deco"></i>
    <h1>New password</h1>
    @if (error()) {
      <div class="banner" role="alert">
        <app-icon name="alert" />
        <span>{{ error() }}</span>
      </div>
    }
    <form (submit)="submit($event, password.value)">
      <label class="field"><span>New password (at least 8 characters)</span><input #password class="input" type="password" required /></label>
      <button class="btn btn-primary" type="submit">Set password</button>
    </form>
    <p class="alt"><a routerLink="/forgot-password">Request a new link</a></p>
  </section>
</div>
