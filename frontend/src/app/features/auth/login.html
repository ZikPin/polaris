<h1>Log in</h1>
<form (submit)="submit($event, email.value, password.value)">
  <p><label>Email <input #email type="email" required /></label></p>
  <p><label>Password <input #password type="password" required /></label></p>
  <p><button type="submit">Log in</button></p>
</form>
@if (error()) {
  <p role="alert">{{ error() }}</p>
}
<p>No account yet? <a routerLink="/register">Register</a></p>
