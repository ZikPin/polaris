<div class="auth">
  <section class="auth-card">
    <i class="deco"></i>
    <h1>Forgot password?</h1>
    @if (sent()) {
      <p class="muted">If an account exists for this address, we have sent it a link to set a new password. The link works for one hour.</p>
    } @else {
      @if (error()) {
        <div class="banner" role="alert">
          <app-icon name="alert" />
          <span>{{ error() }}</span>
        </div>
      }
      <p class="muted">Enter your email and we send you a link to set a new password.</p>
      <form (submit)="submit($event, email.value)">
        <label class="field"><span>Email</span><input #email class="input" type="email" required /></label>
        <button class="btn btn-primary" type="submit">Send link</button>
      </form>
    }
    <p class="alt"><a routerLink="/login">Back to login</a></p>
  </section>
</div>
