<div class="auth">
  <section class="auth-card">
    <i class="deco"></i>
    <h1>Register</h1>
    @if (error()) {
      <div class="banner" role="alert">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7.5v5M12 16v.5" /></svg>
        <span>{{ error() }}</span>
      </div>
    }
    <form (submit)="submit($event, email.value, password.value)">
      <label class="field"><span>Email</span><input #email class="input" type="email" required /></label>
      <label class="field"><span>Password (at least 8 characters)</span><input #password class="input" type="password" required /></label>
      <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p class="alt">Already registered? <a routerLink="/login">Log in</a></p>
  </section>
</div>
