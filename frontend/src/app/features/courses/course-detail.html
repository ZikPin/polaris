<p><a routerLink="/courses">Back to courses</a></p>

@if (course(); as course) {
  <h1>{{ course.title }}</h1>
}

@if (tables(); as tables) {
  <h2>Lectures</h2>
  <app-table-view
    [courseId]="courseId"
    tableType="lecture"
    [table]="tables.lecture"
    (changed)="reload()"
  />

  <h2>Assignments</h2>
  <app-table-view
    [courseId]="courseId"
    tableType="assignment"
    [table]="tables.assignment"
    (changed)="reload()"
  />
}
