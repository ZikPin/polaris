<div class="page-head">
  @if (course(); as course) {
    <h1>{{ course.title }}</h1>
  }
  <a class="btn" routerLink="/courses"><app-icon name="arrow-left" />Back to courses</a>
</div>

@if (tables(); as tables) {
  <div class="tables">
    <app-table-view [courseId]="courseId" tableType="lecture" [table]="tables.lecture" (changed)="reload()" />
    <app-table-view [courseId]="courseId" tableType="assignment" [table]="tables.assignment" (changed)="reload()" />
  </div>
}
